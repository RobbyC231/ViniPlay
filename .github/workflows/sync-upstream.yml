# Fork maintenance (RobbyC231/ViniPlay). Keeps `main` identical to upstream and merges
# it into `mobile`, the branch video-01 builds from. Merge, not rebase: `mobile` history
# never changes, so the commit SHA pinned in proxmox-iac stays valid and no force-push
# is needed. A conflict fails the run (GitHub emails the failure) and pushes nothing;
# resolve it locally in ~/ViniPlay on agent-01. See the Obsidian note "ViniPlay Stack".
#
# Pushes made with GITHUB_TOKEN start no other workflows, so upstream's
# docker-image.yml (push to main) never runs here.
name: Sync upstream

on:
  schedule:
    - cron: "23 4 * * 1" # Mondays 04:23 UTC
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Post a test message to Discord (checks the webhook secret)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency: sync-upstream

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile
          fetch-depth: 0

      - name: Queue test notification
        if: inputs.test_notify
        run: echo "Test message from a manual run; the sync itself ran as normal." > "$RUNNER_TEMP/notify.txt"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/ardoviniandrea/ViniPlay.git
          git fetch --no-tags upstream main

      - name: Mirror upstream main
        run: git push origin refs/remotes/upstream/main:refs/heads/main

      - name: Merge upstream into mobile
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "mobile already contains upstream $(git rev-parse --short upstream/main)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          up=$(git rev-parse --short upstream/main)
          if git merge --no-edit upstream/main; then
            git push origin HEAD:mobile
            {
              echo "Merged upstream $up into mobile: $(git rev-parse HEAD)"
              echo
              echo "Deploy: set viniplay_git_ref to that SHA in proxmox-iac, then run site.yml."
            } | tee "$RUNNER_TEMP/notify.txt" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "Upstream $up conflicts with mobile in:"
              git diff --name-only --diff-filter=U | sed 's/^/- /'
              echo
              echo "Nothing was pushed. Resolve with git merge upstream/main in ~/ViniPlay."
            } | tee "$RUNNER_TEMP/notify.txt" >> "$GITHUB_STEP_SUMMARY"
            git merge --abort
            exit 1
          fi

      # Posts only when something happened: a merge, a conflict, or any other failure.
      # Up-to-date runs stay quiet. No secret set = no post.
      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED: ${{ job.status == 'failure' }}
        run: |
          [ -n "$DISCORD_WEBHOOK" ] || exit 0
          f="$RUNNER_TEMP/notify.txt"
          if [ ! -s "$f" ]; then
            [ "$FAILED" = true ] || exit 0
            echo "Sync upstream failed before the merge step." > "$f"
          fi
          if [ "$FAILED" = true ]; then title="ViniPlay fork: upstream sync FAILED"; else title="ViniPlay fork: upstream merged"; fi
          jq -n --arg t "$title" --arg d "$(cat "$f")" --arg u "$RUN_URL" \
            '{username: "ViniPlay fork", content: "**\($t)**\n\($d)\n<\($u)>"}' |
            curl -fsS -H 'Content-Type: application/json' -d @- "$DISCORD_WEBHOOK"
